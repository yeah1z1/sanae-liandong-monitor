services:
  monitor:
    build:
      context: .
    image: shop-monitor:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - ./config.json:/config/config.json:ro
      - monitor-data:/data
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,os,time; s=json.load(open('/data/state/monitor.json',encoding='utf-8')); p=json.load(open('/data/state/process.json',encoding='utf-8')); os.kill(int(p['pid']),0); age=time.time()-float(s.get('last_complete',0)); raise SystemExit(0 if 0 <= age < 600 else 1)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  monitor-data:
